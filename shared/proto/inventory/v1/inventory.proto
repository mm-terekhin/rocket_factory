syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mm-terekhin/rocket_factory/shared/pkg/proto/inventory/v1;inventory_v1";

service InventoryService {
  rpc GetPart(GetPartRequest) returns (GetPartResponse);
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
  rpc CreatePart(CreatePartRequest) returns (CreatePartResponse);
}

// CreatePartRequest запрос на создание детали
message CreatePartRequest {
  PartInfo info = 1;
}

// CreatePartResponse ответ на создание детали
message CreatePartResponse {
  string uuid = 1;
}

// GetPartRequest запрос на получение детали
message GetPartRequest {
  string uuid = 1;
}

// GetPartResponse ответ на запрос на получение детали
message GetPartResponse {
  Part part = 1;
}

// ListPartsRequest запрос на получение отфильтрованного списка деталей
message ListPartsRequest {
  PartsFilter filter = 1;
}

// PartsFilter фильтр для списка деталей
message PartsFilter {
  // Список UUID'ов. Пусто — не фильтруем по UUID
  repeated string uuids = 1;
  // Список имён. Пусто — не фильтруем по имени
  repeated string names = 2;
  // Список категорий. Пусто — не фильтруем по категории
  repeated Category categories = 3;
  // Список стран производителей. Пусто — не фильтруем по стране
  repeated string manufacturer_countries = 4;
  // Список тегов. Пусто — не фильтруем по тегам
  repeated string tags = 5;
}

// ListPartsResponse ответ на запрос на получение отфильтрованного списка деталей
message ListPartsResponse {
  repeated Part parts = 1;
}

// Category предоставляет информации о категории
enum Category {
  // Неизвестная категория
  CATEGORY_UNSPECIFIED = 0;
  // Двигатель
  CATEGORY_ENGINE = 1;
  // Топливо
  CATEGORY_FUEL = 2;
  // Иллюминатор
  CATEGORY_PORTHOLE = 3;
  // Крыло
  CATEGORY_WING = 4;
}

// Dimensions предоставляет информации о размерах детали
message Dimensions {
  // Длина в см
  double length = 1;
  // Ширина в см
  double width = 2;
  // Высота в см
  double height = 3;
  // Вес в кг
  double weight = 4;
}

// Manufacturer предоставляет информации о производителе
message Manufacturer {
  // Название
  string name = 1;
  // Страна производства
  string country = 2;
  // Сайт производителя
  string website = 3;
}

// Value oneof механизм
message Value {
  oneof kind {
    // Строковое значение
    string string_value = 1;
    // Целое значение
    int64 int64_value = 2;
    // Дробное значение
    double double_value = 3;
    // Логическое значение
    bool bool_value = 4;
  }
}

// Part предоставляет полную информацию о детали
message Part {
  // Уникальный идентификатор детали
  string uuid = 1;
  // Информация о детали
  PartInfo info = 2;
  // Дата создания
  google.protobuf.Timestamp created_at = 3;
  // Дата обновления
  google.protobuf.Timestamp updated_at = 4;
}

// PartInfo базовая информация о детали
message PartInfo {
  // Название детали
  string name = 1;
  // Описание детали
  string description = 2;
  // Цена за единицу
  double price = 3;
  // Количество на складе
  int64 stock_quantity = 4;
  // Категория
  Category category = 5;
  // Размеры детали
  Dimensions dimensions = 6;
  // Информация о производителе
  Manufacturer manufacturer = 7;
  // Теги для быстрого поиска
  repeated string tags = 8;
  // Гибкие метаданные
  map<string, Value> metadata = 9;
}
